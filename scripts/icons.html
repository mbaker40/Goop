<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Goop icons</title></head>
<body style="margin:0;background:#2b2150">
<script type="module">
// Draws the app icons with the game's own sprite code (src/portrait.js). scripts/icons.mjs opens this
// page in a headless browser and saves each canvas as a PNG under public/icons/.
import { portrait } from '/src/portrait.js';
const SIZES = [
  ['icon-192.png', 192, {}], ['icon-512.png', 512, {}],
  ['maskable-192.png', 192, { inset: .5 }], ['maskable-512.png', 512, { inset: .5 }],   // safe zone: the middle 80%
  ['apple-touch-icon.png', 180, { inset: .58 }], ['favicon-32.png', 32, { inset: .8, stars: false }],
];
window.icons = SIZES.map(([name, size, opts]) => {
  const c = document.createElement('canvas'); c.width = c.height = size;
  portrait(c.getContext('2d'), size, 0, opts);
  document.body.appendChild(c);
  return { name, data: c.toDataURL('image/png') };
});
window.iconsDone = true;
</script>
</body></html>
